services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pensiones
      POSTGRES_PASSWORD: pensiones
      POSTGRES_DB: sistema_pensiones
    ports:
      - "5432:5432"
    volumes:
      - sistema_pensiones_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pensiones -d sistema_pensiones"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sistema_pensiones_pg:
